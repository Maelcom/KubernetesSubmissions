apiVersion: apps/v1
kind: Deployment
metadata:
  name: pingpong-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pingpong
  template:
    metadata:
      labels:
        app: pingpong
    spec:
      volumes:
        - name: shared-files
          persistentVolumeClaim:
            claimName: shared-files-claim
      containers:
        - name: pingpong
          image: maelcom/pingpong:1.11
          volumeMounts:
            - name: shared-files
              mountPath: /app/files
          env:
            - name: PINGPONG_COUNTER_FILE
              value: "/app/files/pong_count.log"
