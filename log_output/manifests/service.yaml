apiVersion: v1
kind: Service
metadata:
  name: log-output-svc
spec:
  type: ClusterIP
  selector:
    app: log-output # This is the app as declared in the deployment.
  ports:
    - protocol: TCP
      port: 2346 # This is a port that is accessed by Ingress,
      targetPort: 8001 # This is the port our app expects to listen.
