apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: shared-files
          persistentVolumeClaim:
            claimName: shared-files-claim
      containers:
        - name: log-writer
          image: maelcom/log_writer:1.11
          volumeMounts:
            - name: shared-files
              mountPath: /app/files
          env:
            - name: LOG_FILE
              value: "/app/files/log_output.log"

        - name: log-reader
          image: maelcom/log_reader:1.11
          volumeMounts:
            - name: shared-files
              mountPath: /app/files
          env:
            - name: LOG_FILE
              value: "/app/files/log_output.log"
            - name: PINGPONG_COUNTER_FILE
              value: "/app/files/pong_count.log"
