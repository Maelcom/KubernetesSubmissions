apiVersion: v1
kind: Service
metadata:
  name: todo-backend-svc
spec:
  type: ClusterIP
  selector:
    app: todo-backend # This is the app as declared in the deployment.
  ports:
    - protocol: TCP
      port: 2349 # This is a port that is accessed by Ingress,
      targetPort: 8000 # This is the port our app expects to listen.
