apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: shared-files
          persistentVolumeClaim:
            claimName: shared-files-claim
      containers:
        - name: todo-app
          image: maelcom/todo_app:2.2
          command: ["python", "app.py"]
          volumeMounts:
            - name: shared-files
              mountPath: /app/files
          env:
            - name: TODOS_BACKEND_URL
              value: "http://todo-backend-svc:2349/todos"
