apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: shared-files
          persistentVolumeClaim:
            claimName: shared-files-claim
      containers:
        - name: todo-app
          image: maelcom/todo_app:1.12
          volumeMounts:
            - name: shared-files
              mountPath: /app/files
